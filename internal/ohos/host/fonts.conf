<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>Fontconfig configuration for MyGo on HarmonyOS</description>

	<dir>/system/fonts</dir>
	<dir prefix="xdg">fonts</dir>

	<cachedir prefix="xdg">fontconfig</cachedir>

	<!-- Reject non-scalable bitmap fonts while keeping color bitmap emoji (70-no-bitmaps-except-emoji.conf) -->
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="outline"><bool>false</bool></patelt>
				<patelt name="scalable"><bool>false</bool></patelt>
			</pattern>
		</rejectfont>
	</selectfont>

	<!-- Scale bitmap color emoji fonts such as HMOSColorEmojiCompat.ttf (10-scale-bitmap-fonts.conf) -->
	<match target="font">
		<test name="outline" compare="eq"><bool>false</bool></test>
		<edit name="pixelsizefixupfactor" mode="assign">
			<divide>
				<name target="pattern">pixelsize</name>
				<name target="font">pixelsize</name>
			</divide>
		</edit>
	</match>
	<match target="font">
		<test name="outline" compare="eq"><bool>false</bool></test>
		<test name="scalable" compare="eq"><bool>false</bool></test>
		<test name="hinting" compare="eq"><bool>true</bool></test>
		<edit name="scalingnotneeded" mode="assign">
			<and>
				<less><name>pixelsizefixupfactor</name><double>1.2</double></less>
				<more><name>pixelsizefixupfactor</name><double>0.8</double></more>
			</and>
		</edit>
	</match>
	<match target="font">
		<test name="scalingnotneeded" compare="eq"><bool>true</bool></test>
		<edit name="pixelsizefixupfactor" mode="assign"><double>1.0</double></edit>
	</match>
	<match target="font">
		<test name="outline" compare="eq"><bool>false</bool></test>
		<test name="pixelsizefixupfactor" compare="not_eq"><double>1.0</double></test>
		<edit name="matrix" mode="assign">
			<times>
				<name>matrix</name>
				<matrix>
					<name>pixelsizefixupfactor</name><double>0</double>
					<double>0</double><name>pixelsizefixupfactor</name>
				</matrix>
			</times>
		</edit>
		<edit name="size" mode="assign">
			<divide>
				<name>size</name>
				<name>pixelsizefixupfactor</name>
			</divide>
		</edit>
	</match>

	<match target="pattern">
		<edit mode="append" name="lcdfilter">
			<const>lcddefault</const>
		</edit>
	</match>

	<!-- Normalize common family spellings -->
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system-ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>

	<!-- Emoji language tag & color preference (matches upstream 45/60-generic.conf) -->
	<match>
		<test name="family"><string>emoji</string></test>
		<edit name="lang" mode="prepend"><string>und-zsye</string></edit>
	</match>
	<match>
		<test name="lang"><string>und-zsye</string></test>
		<test qual="all" name="color" compare="not_eq"><bool>true</bool></test>
		<test qual="all" name="color" compare="not_eq"><bool>false</bool></test>
		<edit name="color" mode="append"><bool>true</bool></edit>
	</match>

	<alias binding="same">
		<family>Noto Color Emoji</family>
		<prefer><family>HMOS Color Emoji</family></prefer>
	</alias>

	<alias binding="same">
		<family>emoji</family>
		<prefer><family>HMOS Color Emoji</family></prefer>
	</alias>

	<alias binding="same">
		<family>system-ui</family>
		<prefer>
			<family>HarmonyOS Sans</family>
			<family>HarmonyOS Sans SC</family>
			<family>HarmonyOS Sans TC</family>
			<family>Noto Sans CJK JP</family>
			<family>Noto Sans CJK KR</family>
			<family>Noto Sans</family>
			<family>HMOS Color Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>HarmonyOS Sans</family>
			<family>HarmonyOS Sans SC</family>
			<family>HarmonyOS Sans TC</family>
			<family>Noto Sans CJK JP</family>
			<family>Noto Sans CJK KR</family>
			<family>Noto Sans CJK SC</family>
			<family>Noto Sans CJK TC</family>
			<family>Noto Sans</family>
			<family>HMOS Color Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>serif</family>
		<prefer>
			<family>Noto Serif</family>
			<family>Noto Serif CJK SC</family>
			<family>Noto Serif CJK TC</family>
			<family>Noto Serif CJK JP</family>
			<family>Noto Serif CJK KR</family>
			<family>HMOS Color Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>monospace</family>
		<prefer>
			<family>Noto Sans Mono</family>
			<family>HarmonyOS Sans SC</family>
			<family>HarmonyOS Sans TC</family>
			<family>Noto Sans CJK JP</family>
			<family>Noto Sans CJK KR</family>
			<family>HMOS Color Emoji</family>
		</prefer>
	</alias>
</fontconfig>
